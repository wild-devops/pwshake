pwshake-context:
  module:
    name: pwshake
    path: $[[$_PSScriptRoot_]]
    version: $[[(Get-Content $_PSScriptRoot_\pwshake.psd1 -Raw | Invoke-Expression).ModuleVersion]]

  options:
    max_depth: 100
    tasks_count: 0
    steps_count: 0
    tests_verbosity: Error
    pwshake_verbosity: Normal
    resources_verbosity: Minimal
    json_log_format: '@{"@timestamp"=(Get-Date).ToString("o");message=$_}'

  stages:
    - Load-Resources
    - Merge-Includes
    - Merge-Metadata
    - Override-Attributes
    - Interpolate-Attributes

  pipelines:
    $begin-config:
    - Before-Pipeline
    $on-config-header:
    $process-config:
    $on-config-error:
    $on-config-footer:
    $end-config:
    $begin-all-tasks:
    $before-each-task:
    $on-task-header:
    $process-task:
    $on-task-error:
    $on-task-footer:
    $after-each-task:
    $end-all-tasks:
    $begin-all-steps:
    $before-each-step:
    $on-step-header:
    - $log-out-min
    - $teamcity-block-opened
    $process-step:
    $on-step-error:
    $on-step-footer:
    - $teamcity-block-closed
    $after-each-step:
    $end-all-steps:

  plugins: {}

  secured: []

  types: []

  functions: {}

  filters: {}

  templates: {}

  arguments: {}

  config: {}

  parent: null # DO NOT REMOVE!!!
